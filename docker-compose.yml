services:
  monitoria-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: monitoria-bot

    restart: unless-stopped

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    extra_hosts:
      - "host.docker.internal:host-gateway"

    init: true

    stop_grace_period: 15s
